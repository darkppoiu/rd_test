<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clash Royale</title>
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&amp;display=swap" rel="stylesheet">
  <style>
    /* UI STYLES */
    body {
      font-family: 'Luckiest Guy', cursive;
      background: url('https://i.ibb.co/jkydmhyk/background.jpg') no-repeat center center fixed;
      background-size: cover;
      color: white;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 20, 40, 0.65);
      z-index: -1;
    }

    .container { max-width: 400px; margin: 0 auto; padding: 40px 20px; }
    img.logo { width: 220px; margin-top: 40px; }
    p.tagline { font-size: 18px; margin: 15px 0 30px; }

    button.main-btn {
      background: linear-gradient(180deg, #ffcc00 0%, #e6b800 100%);
      border: 3px solid #000;
      color: #fff;
      padding: 16px 28px;
      font-size: 22px;
      border-radius: 12px;
      cursor: pointer;
      font-family: 'Luckiest Guy', cursive;
      text-transform: uppercase;
      box-shadow: 0 6px 0 #000;
      transition: transform 0.2s ease;
    }

    button.main-btn:hover { transform: scale(1.05); }

    /* MODAL STYLES */
    :root {
      --primary: #2563eb;
      --text-dark: #1f2937;
      --bg-white: #ffffff;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }

    .modal-overlay.active { display: flex; }

    .modal-content {
      background: var(--bg-white);
      width: 90%;
      max-width: 400px;
      border-radius: 16px;
      color: #000;
      overflow: hidden;
      text-align: left;
    }

    .modal-header {
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
    }

    .close-btn { background: none; border: none; font-size: 24px; cursor: pointer; }

    .offer-list { padding: 15px; max-height: 350px; overflow-y: auto; }

    .offer-card {
      display: block;
      padding: 12px;
      margin-bottom: 10px;
      background: #f3f4f6;
      border-radius: 8px;
      text-decoration: none;
      color: var(--primary);
      font-weight: bold;
    }

    footer { margin-top: 60px; background: rgba(0, 0, 0, 0.4); padding: 20px; font-size: 13px; }
  </style>
</head>

<body>
  <div class="container">
    <img src="https://logos-world.net/wp-content/uploads/2023/05/Clash-Royale-Logo.png" alt="Clash Royale Logo" class="logo">
    <p class="tagline">Epic Real-Time Card Battles</p>

    <button id="openOffers" class="main-btn" onclick="myFunc()">Open Clash Royale</button>

    <div class="deco">
      <img src="https://i.ibb.co/1YyrpKyn/king.png" alt="Decoration" style="width:200px;">
    </div>
  </div>

  <div id="offerModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h2 style="margin:0; font-family: sans-serif;">Special Rewards</h2>
        <button class="close-btn" id="closeOffers">&times;</button>
      </div>
      <div id="offerList" class="offer-list">
        <p>Searching for rewards...</p>
      </div>
    </div>
  </div>

  <footer>
    <div>© Supercell 2026</div>
  </footer>

  <script>
    // Elements are defined here
    const modal = document.getElementById('offerModal');
    const offerList = document.getElementById('offerList');
    const closeBtn = document.getElementById('closeOffers');
    const openBtn = document.getElementById('openOffers'); // Target the main button

    const API_URL = "https://d2xohqmdyl2cj3.cloudfront.net/public/offers/feed.php?user_id=584180&api_key=ad55fcf79b3953d539938be8015c3900&s1=&s2=";

    async function fetchOffers() {
      try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error('API Error');
        const data = await response.json();
        
        // Render only if data exists
        if(data && data.length > 0) {
          offerList.innerHTML = data.slice(0, 5).map(offer => `
            <a href="${offer.url}" target="_blank" class="offer-card">
              ${offer.anchor}
              <div style="font-size:12px; color:#666; font-weight:normal;">${offer.conversion}</div>
            </a>
          `).join('');
        } else {
          offerList.innerHTML = '<p>No offers available right now.</p>';
        }
      } catch (err) {
        offerList.innerHTML = '<p>Error loading offers. Please try again.</p>';
      }
    }

    function myFunc() {
      if (modal) {
        modal.classList.add('active');
        fetchOffers();
      }
    }

    // FIXED: Removed the () from myFunc so it doesn't fire immediately on load
    if (openBtn) {
      openBtn.addEventListener('click', myFunc);
    }

    // Close logic
    if (closeBtn) {
      closeBtn.addEventListener('click', () => modal.classList.remove('active'));
    }

    window.addEventListener('click', (e) => {
      if (e.target === modal) modal.classList.remove('active');
    });
  </script>
</body>
</html>
