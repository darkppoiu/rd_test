<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mia Collins | Link Tree</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #fdf2f2;
            --primary-pink: #f8bbd0;
            --accent-maroon: #880e4f;
            --text-color: #4a148c;
            --button-bg: rgba(255, 255, 255, 0.6);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            color: var(--accent-maroon);
        }

        /* Main Mobile Container */
        .container {
            width: 100%;
            max-width: 450px;
            position: relative;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        /* Top Icons */
        .top-nav {
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        /* Profile Section */
        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            margin: 20px 0 30px;
            font-size: 1.8rem;
        }

        /* Link Buttons */
        .links-wrapper { width: 100%; z-index: 2; }

        .link-card {
            background: var(--primary-pink);
            margin-bottom: 15px;
            padding: 15px 20px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            text-decoration: none;
            color: var(--accent-maroon);
            font-weight: 600;
            transition: transform 0.2s;
            cursor: pointer;
        }

        .link-card:hover { transform: scale(1.02); }

        .link-icon {
            width: 40px;
            height: 40px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            color: #00aff0; /* OF Blue */
        }

        .share-small { margin-left: auto; opacity: 0.6; }

        /* Flamingo Background (Bottom) */
        .bottom-art {
            position: absolute;
            bottom: -20px;
            width: 110%;
            opacity: 0.9;
            z-index: 1;
            pointer-events: none;
        }

        /* MODAL / POPUP STYLES */
        #popup-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: none; /* Hidden by default */
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .modal {
            background: white;
            width: 90%;
            max-width: 400px;
            max-height: 80vh;
            border-radius: 24px;
            padding: 25px;
            position: relative;
            overflow-y: auto;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            border: 2px solid var(--primary-pink);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .close-btn { font-size: 1.5rem; cursor: pointer; color: var(--accent-maroon); }

        /* Offer Item in Popup */
        .offer-item {
            display: flex;
            align-items: center;
            padding: 12px;
            margin-bottom: 12px;
            background: #fff9fa;
            border-radius: 12px;
            border: 1px solid #fce4ec;
            text-decoration: none;
            color: #333;
        }

        .offer-img { width: 50px; height: 50px; border-radius: 8px; margin-right: 12px; }
        .offer-info h4 { font-size: 0.9rem; margin-bottom: 4px; color: var(--accent-maroon); }
        .offer-info p { font-size: 0.75rem; color: #666; }

        /* Loader */
        .loader { text-align: center; padding: 20px; color: var(--accent-maroon); }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-nav">
            <i class="fa-solid fa-qrcode"></i>
            <i class="fa-solid fa-share-nodes"></i>
        </div>

        <img src="https://via.placeholder.com/150" alt="Mia Collins" class="profile-pic">
        
        <h1>Mia Collins</h1>

        <div class="links-wrapper">
            <a href="https://onlyfans.com" class="link-card">
                <div class="link-icon"><i class="fa-brands fa-kickstarter-k"></i></div>
                <span>onlyfans</span>
                <i class="fa-solid fa-share-nodes share-small"></i>
            </a>

            <div class="link-card" onclick="openOffers()">
                <div class="link-icon" style="color: #ff4081;"><i class="fa-solid fa-heart"></i></div>
                <span>JustForFans (Offers)</span>
                <i class="fa-solid fa-share-nodes share-small"></i>
            </div>
        </div>

        <img src="https://img.freepik.com/free-vector/hand-drawn-flamingo-pattern-design_23-2148961726.jpg" class="bottom-art">
    </div>

    <div id="popup-overlay" onclick="closeOffers(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3>Special Offers</h3>
                <span class="close-btn" onclick="closeOffers(event)">&times;</span>
            </div>
            <div id="offers-list">
                <div class="loader">Loading amazing offers...</div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://d2xohqmdyl2cj3.cloudfront.net/public/offers/feed.php?user_id=584180&api_key=ad55fcf79b3953d539938be8015c3900";

        async function openOffers() {
            const overlay = document.getElementById('popup-overlay');
            const list = document.getElementById('offers-list');
            overlay.style.display = 'flex';

            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                // Note: API response structure varies. 
                // Adjust 'data.offers' based on actual API return format.
                renderOffers(data); 
            } catch (error) {
                list.innerHTML = "<p>Unable to load offers. Please try again later.</p>";
                console.error("API Error:", error);
            }
        }

        function renderOffers(offers) {
            const list = document.getElementById('offers-list');
            list.innerHTML = ''; // Clear loader

            if (!offers || offers.length === 0) {
                list.innerHTML = "<p>No offers available right now.</p>";
                return;
            }

            // Loop through offers and create HTML
            offers.forEach(offer => {
                const item = document.createElement('a');
                item.href = offer.link || "#";
                item.className = 'offer-item';
                item.innerHTML = `
                    <img src="${offer.image || 'https://via.placeholder.com/50'}" class="offer-img">
                    <div class="offer-info">
                        <h4>${offer.title || 'Special Deal'}</h4>
                        <p>${offer.description || 'Click to see details'}</p>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        function closeOffers(e) {
            document.getElementById('popup-overlay').style.display = 'none';
        }
    </script>
</body>
</html>
