<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mia Collins | Link Tree</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #fdf2f2;
            --primary-pink: #f8bbd0;
            --accent-maroon: #880e4f;
            --card-bg: rgba(255, 255, 255, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            color: var(--accent-maroon);
            overflow: hidden;
        }

        /* --- Main Mobile Container --- */
        .container {
            width: 100%;
            max-width: 430px;
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .top-icons {
            width: 100%;
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 1.3rem;
        }

        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid white;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            object-fit: cover;
            margin-bottom: 20px;
        }

        h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 30px; }

        /* --- Link Buttons --- */
        .link-item {
            width: 100%;
            background: var(--primary-pink);
            padding: 16px 20px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            margin-bottom: 16px;
            cursor: pointer;
            transition: 0.3s;
            border: none;
            color: var(--accent-maroon);
            font-weight: 600;
            font-size: 1rem;
        }

        .link-item:hover { transform: scale(1.02); filter: brightness(1.03); }

        .icon-box {
            width: 38px;
            height: 38px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
        }

        .fa-share-nodes { margin-left: auto; opacity: 0.6; font-size: 0.9rem; }

        /* Flamingo Image Background */
        .flamingo-bg {
            position: absolute;
            bottom: 0;
            width: 100%;
            pointer-events: none;
            z-index: -1;
        }

        /* --- PROFESSIONAL POPUP (LOCKER) --- */
        #locker {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            display: none; /* Hidden */
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }

        .modal {
            background: white;
            width: 100%;
            max-width: 380px;
            border-radius: 30px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            border: 2px solid var(--primary-pink);
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal h2 { font-size: 1.4rem; margin-bottom: 10px; }
        .modal p { font-size: 0.9rem; color: #555; margin-bottom: 25px; line-height: 1.4; }

        /* Offer Items (Limit to 3) */
        .offer-row {
            display: flex;
            align-items: center;
            padding: 12px;
            background: #fff9fa;
            border: 1px solid #fce4ec;
            border-radius: 15px;
            margin-bottom: 10px;
            text-decoration: none;
            color: #333;
            text-align: left;
        }

        .offer-row:hover { background: var(--primary-pink); }
        .offer-img { width: 45px; height: 45px; border-radius: 10px; margin-right: 12px; }
        .offer-text b { display: block; font-size: 0.85rem; color: var(--accent-maroon); }
        .offer-text span { font-size: 0.75rem; color: #777; }

        .close-btn { margin-top: 15px; background: none; border: none; color: #aaa; cursor: pointer; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-icons">
            <i class="fa-solid fa-qrcode"></i>
            <i class="fa-solid fa-share-nodes"></i>
        </div>

        <img src="https://via.placeholder.com/150" class="profile-pic">
        
        <h1>Mia Collins</h1>

        <button class="link-item" onclick="showLocker()">
            <div class="icon-box"><i class="fa-solid fa-star" style="color: #00aff0;"></i></div>
            OnlyFans
            <i class="fa-solid fa-share-nodes"></i>
        </button>

        <button class="link-item" onclick="showLocker()">
            <div class="icon-box"><i class="fa-solid fa-heart" style="color: #ff4081;"></i></div>
            JustForFans
            <i class="fa-solid fa-share-nodes"></i>
        </button>

        <img src="https://i.imgur.com/mOa7XbM.png" class="flamingo-bg">
    </div>

    <div id="locker">
        <div class="modal">
            <h2>Human Verification</h2>
            <p>Complete <b>one offer</b> below to unlock Mia's exclusive content.</p>
            
            <div id="offer-list">
                <p style="padding: 20px;">Loading offers...</p>
            </div>

            <button class="close-btn" onclick="hideLocker()">Cancel</button>
        </div>
    </div>

    <script>
        const API_URL = "https://d2xohqmdyl2cj3.cloudfront.net/public/offers/feed.php?user_id=584180&api_key=ad55fcf79b3953d539938be8015c3900";

        function showLocker() {
            document.getElementById('locker').style.display = 'flex';
            loadOffers();
        }

        function hideLocker() {
            document.getElementById('locker').style.display = 'none';
        }

        async function loadOffers() {
            const listDiv = document.getElementById('offer-list');
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                // Get the array of offers (handle different API formats)
                const allOffers = Array.isArray(data) ? data : (data.offers || []);

                // CRITICAL: Filter to only the first 3 offers
                const topThree = allOffers.slice(0, 3);

                if (topThree.length === 0) {
                    listDiv.innerHTML = "No offers available right now.";
                    return;
                }

                listDiv.innerHTML = ""; // Clear loader

                topThree.forEach(offer => {
                    const row = document.createElement('a');
                    row.className = 'offer-row';
                    row.href = offer.link;
                    row.target = "_blank";
                    row.innerHTML = `
                        <img src="${offer.picture || 'https://via.placeholder.com/50'}" class="offer-img">
                        <div class="offer-text">
                            <b>${offer.name || 'Special Offer'}</b>
                            <span>${offer.adcopy || 'Click to verify'}</span>
                        </div>
                    `;
                    listDiv.appendChild(row);
                });

            } catch (err) {
                listDiv.innerHTML = "Error loading offers. Please refresh.";
            }
        }
    </script>
</body>
</html>
